# This action will use hemtt release to build the mod folder which then will be uploaded to the provided steam workshop page
#
# Pre-Requisites
# - Mod needs to be already on the Workshop
# - Steam Account that owns Arma and needs to be a contributer to the workshop item.
# -- It is recommended to use a dedicated Steam Account with 2FA disabled.
#
# How to use
#
# 1. Update FOLDER, WORKSHOPID and WORKSHOPNAME below
# 2. Add STEAM_USERNAME as github repo secret
# 3. Add STEAM_PASSWORD as github repo secret
# -- Org secrets with these names also work, EXCEPT for private repos in an org on the GitHub Free plan:
#    there they reach the workflow empty. The "Check Steam secrets" step below catches that.
# 4. Remove the `if: false` line of the job
#
# The STABLE release only runs on full releases and sets _DEV_VERSION_ 0 (see addons/main/debug_mode.hpp)

name: "Release: Publish to Steam"

env:
  FOLDER: '@example_mod'
  WORKSHOPID: '0000000000'
  WORKSHOPNAME: 'Example Mod'

on:
  release:
    types: [released]

permissions:
  contents: write

jobs:

  release-addon:
    if: false # Remove this line once the workflow is set up - see "How to use" above
    runs-on: ubuntu-latest
    steps:
        # Fail before the build instead of at the Workshop upload, where empty secrets only show steamcmd's usage text.
        - name: Check Steam secrets
          env:
            STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
            STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          run: |
            missing=""
            [ -z "$STEAM_USERNAME" ] && missing="$missing STEAM_USERNAME"
            [ -z "$STEAM_PASSWORD" ] && missing="$missing STEAM_PASSWORD"
            if [ -n "$missing" ]; then
              echo "::error title=Steam secrets missing::Empty:$missing. Set them as repo secrets (gh secret set <NAME> --repo ${{ github.repository }}). Org secrets reach private repos empty on the GitHub Free plan."
              exit 1
            fi
            echo "Steam secrets are set."

        - name: Set VERSION env
          run: echo VERSION=${GITHUB_REF:11} >> $GITHUB_ENV

        - name: Checkout the source code
          uses: actions/checkout@v4

        - name: Update script_version.hpp from release tag
          shell: pwsh
          run: |
            & "${{ github.workspace }}/tools/update-version.ps1" `
              -Version "${{ github.event.release.tag_name }}"

        - name: Create meta.cpp for stable release
          shell: pwsh
          run: |
            & "${{ github.workspace }}/tools/create-meta-cpp.ps1" `
              -FilePath "${{ github.workspace }}/meta.cpp" `
              -PublishedId "${{ env.WORKSHOPID }}" `
              -ModName "${{ env.WORKSHOPNAME }}"

        - name: Setup HEMTT
          uses: arma-actions/hemtt@v1

        - name: Run HEMTT script set_RELEASE_VERSION_STABLE
          run: hemtt script set_RELEASE_VERSION_STABLE

        - name: Run HEMTT build
          run: hemtt release --no-archive

        - name: Move release to releases folder
          run: mv .hemttout/release "${{ env.FOLDER }}-${{ env.VERSION }}"

        - name: Zip release
          run: zip -r "${{ env.FOLDER }}-${{ env.VERSION }}.zip" ./${{ env.FOLDER }}-${{ env.VERSION }}

        - name: Update Release with Files
          uses: softprops/action-gh-release@v2
          with:
            files: ./${{ env.FOLDER }}-${{ env.VERSION }}.zip
            draft: true
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        - name: Prepare Steam changelog
          id: changelog
          env:
            RELEASE_BODY: ${{ github.event.release.body }}
          run: |
            # steamcmd writes the changelog into a VDF file - double quotes and backslashes in the release notes would break it - both are replaced with ' (octal: \042 ", \134 \, \047 ')
            {
              echo 'text<<CHANGELOG_EOF'
              printf '%s\n' "$RELEASE_BODY" | tr '\042\134' '\047\047'
              echo 'CHANGELOG_EOF'
            } >> "$GITHUB_OUTPUT"

        - name: Update to Steam Workshop (stable)
          uses: arma-actions/workshop-upload@v1
          with:
            itemId: ${{ env.WORKSHOPID }}
            contentPath: './${{ env.FOLDER }}-${{ env.VERSION }}'
            changelog: |
              https://github.com/${{ github.repository }}/releases/tag/v${{ env.VERSION }}

              ${{ steps.changelog.outputs.text }}
          env:
            STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
            STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}

# Drafts the next GitHub release with release notes sorted from labelled pull requests.
# Needs .github/release-drafter.yml in this repository.
# Documentation: https://github.com/A3-AZ/a3_workflows/tree/main/draft_changelog

name: "Release: Draft Changelog"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Each run rebuilds the whole draft, so only the newest run matters
concurrency:
  group: draft_changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # create and update the draft release
      pull-requests: read # read the merged pull requests and their labels
    steps:
      - name: Draft release
        uses: A3-AZ/a3_workflows/draft_changelog@v1
        # with:
        #   config-name: release-drafter.yml

# Runs hemtt check on every push to main and on every pull request against main.
# Documentation: https://github.com/A3-AZ/a3_workflows/tree/main/validate_hemtt
#
# Copy this file to .github/workflows/validate_hemtt.yml. No values need to be filled in.

name: "Validate: HEMTT"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    if: github.repository != 'OverlordZorn/ZRN-Mod-Template' # the template only ships this workflow - it runs in mods created from it
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v7

      - name: Validate HEMTT
        uses: A3-AZ/a3_workflows/validate_hemtt@v1
        # with:
        #   check-args: '--pedantic'
        #   hemtt-version: 'latest'
